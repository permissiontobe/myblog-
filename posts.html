<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog Post</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Georgia', serif;

  background: radial-gradient(circle at top, #1b1b2f, #0b0b14);

  color: #f5f3ef;
}

.container {
  max-width: 900px;
  width: 90%;

  margin: 100px auto 50px auto;
  padding: 30px;

  background: rgba(255,255,255,0.05);

  border-radius: 16px;

  box-shadow: 0 0 20px rgba(255,220,180,0.1);

  line-height: 1.8;
  font-size: 18px;

  overflow: hidden;
}
.container * {
  max-width: 100%;
  box-sizing: border-box;
  overflow-wrap: break-word;
  word-wrap: break-word;
}

.container,
.container p,
.container h1,
.container h2,
.container h3,
.container li,
.container strong {
  color: #f5f3ef;
}
h1 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 32px;
  font-weight: 600;

}

p {
  line-height: 1.8;
  font-size: 18px;
  margin-top: 20px;
  white-space: pre-wrap;

}

#likeBtn {
  margin-top: 30px;
  padding: 12px 22px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
  background: linear-gradient(135deg, #ff9eb5, #ffcaa6);
  color: #1b1b2f;
  transition: all 0.3s ease;
  box-shadow: 0 0 20px rgba(255, 120, 170, 0.4);
}

#likeBtn:hover {
  transform: translateY(-4px) scale(1.05);
  box-shadow: 0 0 35px rgba(255, 120, 170, 0.8);
}

#likeBtn.liked {
  background: linear-gradient(135deg, #ff3e6c, #ff8eb8);
  color: white;
}

.comments-section {
  margin-top: 50px;
}

.comments-section textarea {
  width: 100%;
  height: 80px;
  margin-top: 15px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  resize: none;
}

.comments-section button {
  margin-top: 10px;
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #ffcaa6;
  font-weight: bold;
}

.comment {
  margin-top: 15px;
  padding: 10px;
  background: rgba(255,255,255,0.07);
  border-radius: 8px;
}

.back-btn {
  display: inline-block;
  margin-top: 40px;
  padding: 10px 18px;
  border-radius: 10px;
  background: #ffcaa6;
  color: #1b1b2f;
  font-weight: bold;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<h1 id="postTitle">Loading…</h1>
<p id="postText"></p>

<button id="likeBtn">❤️ Like</button>
<span id="likeCount">0</span> likes

<div class="comments-section">
  <h3>Comments</h3>
  <div id="commentsList"></div>
  <textarea id="commentInput" placeholder="Write something thoughtful..."></textarea>
  <button id="commentBtn">Post Comment</button>
</div>

<a href="index.html" class="back-btn">← Back to Blog</a>

</div>

<script>

/* -------- GET POST ID -------- */
const urlParams = new URLSearchParams(window.location.search);
const postId = parseInt(urlParams.get('id'));

/* -------- LOAD POSTS -------- */
let posts = JSON.parse(localStorage.getItem("blogPosts")) || [];
if (posts.length === 0) {
  fetch('posts.json')
    .then(res => res.json())
    .then(json => {
      posts = json;
      loadPost();
    })
    .catch(showError);
} else {
  loadPost();
}

/* -------- LOAD SINGLE POST -------- */
function loadPost() {
 const post = posts.find(p => p.id == postId);

  const titleElem = document.getElementById("postTitle");
  const textElem = document.getElementById("postText");

  if (!post) {
    showError();
    return;
  }

  titleElem.textContent = post.title;
textElem.innerHTML = post.content || post.text;

  setupLikes();
  setupComments();
}

/* -------- ERROR -------- */
function showError() {
  document.getElementById("postTitle").textContent = "Post not found 🌿";
  document.getElementById("postText").textContent = "This post does not exist or was removed.";
}

/* -------- LIKES -------- */
function setupLikes() {
  const likeBtn = document.getElementById("likeBtn");
  const likeCountElem = document.getElementById("likeCount");

  let likesData = JSON.parse(localStorage.getItem("likes")) || {};
  let userLikes = JSON.parse(localStorage.getItem("userLikes")) || {};

  likesData[postId] = likesData[postId] || 0;

  likeCountElem.textContent = likesData[postId];

  if (userLikes[postId]) {
    likeBtn.classList.add("liked");
  }

  likeBtn.addEventListener("click", () => {
    if (userLikes[postId]) return;

    likesData[postId]++;
    userLikes[postId] = true;

    localStorage.setItem("likes", JSON.stringify(likesData));
    localStorage.setItem("userLikes", JSON.stringify(userLikes));

    likeCountElem.textContent = likesData[postId];
    likeBtn.classList.add("liked");
  });
}

/* -------- COMMENTS -------- */
function setupComments() {
  const commentInput = document.getElementById("commentInput");
  const commentBtn = document.getElementById("commentBtn");
  const commentsList = document.getElementById("commentsList");

  let commentsData = JSON.parse(localStorage.getItem("comments")) || {};
  commentsData[postId] = commentsData[postId] || [];

  function renderComments() {
    commentsList.innerHTML = "";

    commentsData[postId].forEach(comment => {
      const div = document.createElement("div");
      div.classList.add("comment");
      div.textContent = comment;
      commentsList.appendChild(div);
    });
  }

  renderComments();

  commentBtn.addEventListener("click", () => {
    const newComment = commentInput.value.trim();

    if (newComment !== "") {
      commentsData[postId].push(newComment);
      localStorage.setItem("comments", JSON.stringify(commentsData));

      commentInput.value = "";
      renderComments();
    }
  });
}

</script>

</body>
</html>
