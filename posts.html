<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog Post</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Georgia', serif;
  background: radial-gradient(circle at top, #1b1b2f, #0b0b14);
  color: #f5f3ef;
}

.container {
  max-width: 900px;
  width: 90%;
  margin: 100px auto 50px auto;
  padding: 30px;
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  box-shadow: 0 0 20px rgba(255,220,180,0.1);
  line-height: 1.8;
  font-size: 18px;
  overflow: hidden;
}

.container * {
  max-width: 100%;
  box-sizing: border-box;
  overflow-wrap: break-word;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 32px;
}

p {
  white-space: pre-wrap;
}

#likeBtn {
  margin-top: 30px;
  padding: 12px 22px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  font-weight: bold;
  background: linear-gradient(135deg, #ff9eb5, #ffcaa6);
  color: #1b1b2f;
}

#likeBtn.liked {
  background: linear-gradient(135deg, #ff3e6c, #ff8eb8);
  color: white;
}

.comments-section {
  margin-top: 50px;
}

.comments-section textarea {
  width: 100%;
  height: 80px;
  margin-top: 15px;
}

.comment {
  margin-top: 10px;
  padding: 10px;
  background: rgba(255,255,255,0.07);
  border-radius: 8px;
}

.back-btn {
  display: inline-block;
  margin-top: 40px;
  padding: 10px 18px;
  border-radius: 10px;
  background: #ffcaa6;
  color: #1b1b2f;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1 id="postTitle">Loading…</h1>
<p id="postText"></p>

<button id="likeBtn">❤️ Like</button>
<span id="likeCount">0</span> likes

<div class="comments-section">
  <h3>Comments</h3>
  <div id="commentsList"></div>
  <textarea id="commentInput" placeholder="Write something thoughtful..."></textarea>
  <button id="commentBtn">Post Comment</button>
</div>

<a href="index.html" class="back-btn">← Back to Blog</a>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const client = supabase.createClient(
  "https://viwhwsygirdmaeevcrwp.supabase.co",
  "sb_publishable_BKGXlLvYSfOZcufIuo9dDA_YY0avhaF"
);

const urlParams = new URLSearchParams(window.location.search);
const postSlug = urlParams.get('slug');

let posts = [];

/* ---------- INIT ---------- */
init();

async function init() {

  try {

    const { data, error } = await client
      .from("posts")
      .select("*");

    if (error) {
      throw error;
    }

    posts = data;

    loadPost();

  } catch (err) {

    console.error(err);

    showError();

  }

}

/* ---------- LOAD POST ---------- */
function loadPost() {

  const post = posts.find(p => p.slug === postSlug);

  const titleElem = document.getElementById("postTitle");
  const textElem = document.getElementById("postText");

  if (!post) {
    showError();
    return;
  }

  titleElem.textContent = post.title;
  textElem.innerHTML = post.content || post.text;

  setupLikes();
  setupComments();
}

/* ---------- ERROR ---------- */
function showError() {
  document.getElementById("postTitle").textContent = "Post not found 🌿";
  document.getElementById("postText").textContent =
    "This post does not exist or failed to load. Check console for errors.";
}

/* ---------- LIKES ---------- */
function setupLikes() {

  const likeBtn = document.getElementById("likeBtn");
  const likeCountElem = document.getElementById("likeCount");

  let likesData = JSON.parse(localStorage.getItem("likes")) || {};
  let userLikes = JSON.parse(localStorage.getItem("userLikes")) || {};

likesData[postSlug] = likesData[postSlug] || 0;

  likeCountElem.textContent = likesData[postSlug]

  if (userLikes[postSlug]) {
    likeBtn.classList.add("liked");
  }

  likeBtn.addEventListener("click", () => {
    if (userLikes[postSlug]) return;

   likesData[postSlug]++;
  userLikes[postSlug] = true;

    localStorage.setItem("likes", JSON.stringify(likesData));
    localStorage.setItem("userLikes", JSON.stringify(userLikes));

    likeCountElem.textContent = likesData[postSlug];
    likeBtn.classList.add("liked");
  });
}

/* ---------- COMMENTS ---------- */
function setupComments() {

  const commentInput = document.getElementById("commentInput");
  const commentBtn = document.getElementById("commentBtn");
  const commentsList = document.getElementById("commentsList");

  let commentsData = JSON.parse(localStorage.getItem("comments")) || {};
commentsData[postSlug] = commentsData[postSlug] || [];

  function render() {
    commentsList.innerHTML = "";

  commentsData[postSlug].forEach(c => {
      const div = document.createElement("div");
      div.classList.add("comment");
      div.textContent = c;
      commentsList.appendChild(div);
    });
  }

  render();

  commentBtn.addEventListener("click", () => {

    const text = commentInput.value.trim();

    if (!text) return;

   commentsData[postSlug].push(text);

    localStorage.setItem("comments", JSON.stringify(commentsData));

    commentInput.value = "";
    render();
  });
}

</script>

</body>
</html>
